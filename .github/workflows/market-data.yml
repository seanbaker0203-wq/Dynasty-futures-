# Daily: collect new dynasty trades from public Sleeper leagues, refit our trade values, commit the data files.
# State (all trades and known leagues) lives in the Actions cache, not in git. Only two small JSON files are committed.
name: Market data

on:
  schedule:
    - cron: '23 10 * * *' # 10:23 UTC daily (early morning US)
  workflow_dispatch:
    inputs:
      discover_minutes:
        description: Minutes spent finding new leagues
        default: '15'
      refresh_minutes:
        description: Minutes spent re-checking known leagues
        default: '25'

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy scipy

      - name: Restore collected trades
        uses: actions/cache/restore@v4
        with:
          path: market-state
          key: market-state-${{ github.run_id }}
          restore-keys: market-state-

      - name: Collect trades
        run: npx tsx scripts/collect/market-job.ts market-state ${{ inputs.discover_minutes || '15' }} ${{ inputs.refresh_minutes || '25' }}

      - name: Save collected trades
        if: always()
        uses: actions/cache/save@v4
        with:
          path: market-state
          key: market-state-${{ github.run_id }}

      - name: Fit values and build data files
        run: python3 -I scripts/analysis/build_market_data.py market-state/trades.ndjson data

      - name: Commit if changed
        run: |
          git config user.name "market-data bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/trade-values.json data/market-trades.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Market data: daily trade values and recent trades"
          git push
