# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dynasty-futures
    runtime: node
    # free sleeps after 15 min idle (~1 min wake-up). Switch to 0.5c-512mb ($7/mo) for always-on.
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: GEMINI_API_KEY
        sync: false
